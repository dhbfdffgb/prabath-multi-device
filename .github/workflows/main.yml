name: Node.js CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
     
jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]

        env:
          SESSION_ID: PRABATH-MD~gSyAPcctc397NXI
          GITHUB_AUTH_TOKEN: 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
          BOT_NUMBER: 94768511658
          
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: \${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Start application
      run: npm start
